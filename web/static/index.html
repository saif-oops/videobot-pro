<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeraPlayer — Stream &amp; Download</title>
  <meta name="description" content="Stream and download TeraBox videos instantly. No ads, no paywalls, unlimited playback.">
  <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <img src="/static/logo.jpg" alt="TeraPlayer" class="logo-img">
        TeraPlayer
      </div>
      <p class="subtitle">Stream &amp; download TeraBox videos instantly</p>
    </header>

    <!-- URL Input -->
    <section class="input-section" id="inputSection">
      <label class="input-label">
        🔗 Paste TeraBox Link
      </label>
      <div class="input-wrapper">
        <input
          type="url"
          id="urlInput"
          placeholder="https://1024tera.com/s/..."
          autocomplete="off"
          spellcheck="false"
        >
        <button class="btn btn-paste" id="pasteBtn" title="Paste from clipboard">
          📋
        </button>
      </div>
      <button class="btn btn-primary btn-fetch" id="fetchBtn">
        <span class="spinner" id="fetchSpinner"></span>
        <span id="fetchBtnText">🔍 Fetch Video</span>
      </button>
    </section>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
      <span id="statusIcon"></span>
      <span id="statusText"></span>
    </div>

    <!-- Player Card -->
    <section class="player-card" id="playerCard">
      <!-- Video Player -->
      <div class="video-wrapper" id="videoWrapper">
        <video
          id="videoPlayer"
          controls
          playsinline
          preload="metadata"
          crossorigin="anonymous"
        ></video>
        <div class="video-overlay" id="videoOverlay">
          <div class="play-badge" id="playBadge">▶</div>
        </div>
      </div>

      <!-- Video Info -->
      <div class="video-info">
        <h1 class="video-title" id="videoTitle">Loading…</h1>
        <div class="video-meta" id="videoMeta">
          <!-- Badges populated by JS -->
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
          <button class="btn btn-download" id="downloadBtn">
            ⬇️ Download Video
          </button>
          <button class="btn btn-secondary" id="pipBtn" title="Picture-in-Picture">
            🖼
          </button>
          <button class="btn btn-secondary" id="fullscreenBtn" title="Fullscreen">
            ⛶
          </button>
        </div>

        <!-- Download Progress -->
        <div class="download-progress" id="downloadProgress">
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <p class="progress-text" id="progressText">Preparing download…</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="powered-by">
      Powered by <a href="https://t.me/Tera_Player_Bot" target="_blank">@Tera_Player_Bot</a>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="/static/player.js"></script>
</body>
</html>
