<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DiskWala API Extractor Test</title>
  <style>
    body { font-family: monospace; background: #0c0f17; color: #fff; padding: 24px; }
    pre { background: #1a202c; padding: 16px; border-radius: 8px; overflow: auto; color: #4ade80; }
    button { padding: 10px 20px; font-weight: bold; background: #8b5cf6; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>DiskWala Live Stream Extractor Test</h2>
  <p>Target ID: <code>6ace62e32a52418b242be6b8</code></p>
  <button id="runBtn">Run Extractor</button>
  <pre id="output">Click "Run Extractor" to test live extraction...</pre>

  <script type="module">
    const output = document.getElementById('output');
    const runBtn = document.getElementById('runBtn');

    runBtn.addEventListener('click', async () => {
      output.textContent = "Loading Appicrypt SDK...";
      try {
        let appicryptModule;
        try {
          appicryptModule = await import('/pkg/appicrypt-web-f-0_1_216.js');
        } catch (e) {
          output.textContent += "\nLocal SDK load failed, trying Diskwala CDN: " + e.message;
          appicryptModule = await import('https://www.diskwala.com/pkg/appicrypt-web-f-0_1_216.js');
        }
        output.textContent += "\nSDK loaded! Fetching magic file...";
        
        // Fetch qt magic string
        const qtResp = await fetch('/static/qt.txt');
        const qt = (await qtResp.text()).trim();
        
        output.textContent += "\nSetting magic file in WASM...";
        await appicryptModule.setMagicFile(qt);
        window.appicryptModule = appicryptModule;
        output.textContent += "\nWASM Initialized successfully!";

        function Yt(e) {
          if (null === e || void 0 === e) return "";
          if ("object" !== typeof e) return JSON.stringify(e);
          if (Array.isArray(e)) return `[${e.map(Yt).join(",")}]`;
          return `{${Object.keys(e).sort().map(t => `${JSON.stringify(t)}:${Yt(e[t])}`).join(",")}}`;
        }

        async function signRequest(method, urlPath, params = null, data = null) {
          const ts = Date.now().toString();
          const paramsStr = params ? Yt(params) : "";
          const bodyStr = data ? (typeof data === 'string' ? data : Yt(data)) : "";
          const c = `${(method || "GET").toUpperCase()} ${urlPath || ""} | params=${paramsStr} | body=${bodyStr} | ts=${ts}`;
          
          const u = new TextEncoder().encode(c);
          const d = await crypto.subtle.digest("SHA-256", u);
          const cryptogram = await appicryptModule.getCryptogram(new Uint8Array(d));
          
          return {
            "Appicrypt": cryptogram,
            "Appicrypt-ts": ts,
          };
        }
        window.signRequest = signRequest;

        const testCode = "6ace62e32a52418b242be6b8";
        const urlPath = `/file/temp_info`;
        const bodyObj = { id: testCode };
        output.textContent += `\nSigning POST ${urlPath} with ${JSON.stringify(bodyObj)}...`;

        const sig = await signRequest("POST", urlPath, null, bodyObj);
        output.textContent += `\nFULL_SIG:${JSON.stringify(sig)}`;

        output.textContent += `\nCalling backend /api/diskwala_meta...`;
        try {
          const resp = await fetch(`/api/diskwala_meta`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: testCode,
              appicrypt: sig.Appicrypt,
              appicrypt_ts: sig["Appicrypt-ts"]
            })
          });
          const resData = await resp.json();
          output.textContent += `\nResponse Status: ${resp.status} ${resp.statusText}\n\n`;
          output.textContent += JSON.stringify(resData, null, 2);
        } catch (e) {
          output.textContent += `\nBackend proxy failed: ${e.message}`;
        }

      } catch (err) {
        output.textContent += `\n❌ Error: ${err.message || err}\n${err.stack || ''}`;
      }
    });
  </script>
</body>
</html>
